<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinevoTV</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 6%;
      background: #111118;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #e50914;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
    }

    .hero {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 6%;
      background: linear-gradient(135deg, #1b1b2b, #08080c);
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #c9c9d0;
      font-size: 20px;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .search {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    section {
      padding: 35px 6%;
    }

    section h2 {
      margin-bottom: 20px;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .card {
      min-height: 240px;
      border-radius: 12px;
      background: #1b1b24;
      padding: 20px;
      display: flex;
      align-items: flex-end;
      font-size: 20px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">CinevoTV</div>

  <nav>
    <a href="#">Inicio</a>
    <a href="#peliculas">Películas</a>
    <a href="#series">Series</a>
  </nav>
</header>

<div class="hero">
  <h1>Bienvenido a CinevoTV</h1>
  <p>Descubre películas y series desde una plataforma sencilla, moderna y rápida.</p>

  <input
    class="search"
    type="search"
    placeholder="Buscar películas o series..."
  >
</div>
<div style="display:flex; gap:10px; margin:20px 0;">
  <button onclick="document.getElementById('peliculas').style.display='block'; document.getElementById('series').style.display='block';">
    Todo
  </button>

  <button onclick="document.getElementById('peliculas').style.display='block'; document.getElementById('series').style.display='none';">
    Movies
  </button>

  <button onclick="document.getElementById('peliculas').style.display='none'; document.getElementById('series').style.display='block';">
    Series
  </button>
</div>
<section id="peliculas">
  <h2>Películas</h2>

  <div class="catalog">
   <script>
  const movies = [
    "Movie 1",
    "Movie 2",
    "Movie 3",
    "Movie 4"
  ];

  const movieCatalog = document.currentScript.parentElement;

  movies.forEach(title => {
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = title;
    if (title === "Movie 1") {
  card.style.backgroundImage =
    'url("https://placehold.co/600x900/1b1b2b/ffffff?text=Movie+1")';
  card.style.backgroundSize = "cover";
  card.style.backgroundPosition = "center";
  card.style.color = "white";
  card.style.textShadow = "0 2px 6px black";
}
    movieCatalog.insertBefore(card, document.currentScript);
  });
</script>
  </div>
</section>

<section id="series">
  <h2>Series</h2>

  <div class="catalog">
  <script>
  const series = [
    "Series 1",
    "Series 2",
    "Series 3",
    "Series 4"
  ];

  const seriesCatalog = document.currentScript.parentElement;

  series.forEach(title => {
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = title;
    seriesCatalog.insertBefore(card, document.currentScript);
  });
</script>
  </div>
</section>

<footer>
  CinevoTV — Prototipo
</footer>
<div id="details" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#181818; padding:30px; border-radius:14px; width:min(700px,90%);">
    <button onclick="closeDetails()" style="float:right; font-size:22px; background:none; color:white; border:0; cursor:pointer;">✕</button>

    <h2 id="detailsTitle">Movie</h2>
<p id="detailsType">Tipo: Movie</p>
<p id="detailsDescription">Descripción del título.</p>

    <button onclick="playMovie()" style="background:#e50914; color:white; border:0; padding:12px 24px; border-radius:6px; font-size:18px; cursor:pointer;">
      ▶ Play
    </button>

    <div id="playerBox" style="display:none; margin-top:20px;">
      <video id="moviePlayer" controls style="width:100%; border-radius:10px;">
       <source id="videoSource" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      </video>
    </div>
  </div>
</div>

<script>
  const cards = document.querySelectorAll('.card');

  cards.forEach(card => {
    card.style.cursor = 'pointer';

    card.addEventListener('click', () => {
  const isSeries = card.closest('section')?.id === 'series';
const movieTitle = card.textContent.trim();

const movieVideos = {
  "Movie 1": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "Movie 2": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "Movie 3": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "Movie 4": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
};
const seriesVideos = {
  "Series 1": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "Series 2": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "Series 3": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "Series 4": "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
};
const videoSource = document.getElementById("videoSource");
videoSource.src = (isSeries ? seriesVideos[movieTitle] : movieVideos[movieTitle]) || "";
document.getElementById("moviePlayer").load();
  document.getElementById('detailsTitle').textContent = card.textContent;

  document.getElementById('detailsType').textContent =
    isSeries ? 'Tipo: Series' : 'Tipo: Movie';

  document.getElementById('detailsDescription').textContent =
    isSeries ? 'Descripción de la serie.' : 'Descripción de la película.';

  document.getElementById('details').style.display = 'flex';
  document.getElementById('playerBox').style.display = 'none';
});
  });

  function closeDetails() {
    document.getElementById('details').style.display = 'none';
    document.getElementById('moviePlayer').pause();
  }

  function playMovie() {
  const player = document.getElementById("moviePlayer");
  const playerBox = document.getElementById("playerBox");

  playerBox.style.display = "block";

  player.play().catch(error => {
    console.log("No se pudo reproducir el video:", error);
  });
}
</script>
<script>
  const searchInput = document.querySelector('.search, input[type="search"]');
  const searchCards = document.querySelectorAll('.card');

  if (searchInput) {
    searchInput.addEventListener('input', () => {
      const text = searchInput.value.toLowerCase().trim();

      searchCards.forEach(card => {
        const title = card.textContent.toLowerCase();
        card.style.display = title.includes(text) ? '' : 'none';
      });
    });
  }
</script>
</body>
  <style>
/* Efecto profesional CinevoTV */
.movie-card,
.series-card,
.card {
  transition: transform 0.3s ease,
              box-shadow 0.3s ease;
  cursor: pointer;
}

.movie-card:hover,
.series-card:hover,
.card:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 30px rgba(229, 9, 20, 0.4);
}
</style>
</html>
